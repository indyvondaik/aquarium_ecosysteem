name: aquarium_ecosysteem
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  audioplayers: ^6.1.0
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/app/assets/sound_effects/
    - lib/app/assets/animals/
    - lib/app/assets/animals/aqaurium_dieren.png
    - lib/app/assets/quiz_fotos/
  fonts:
    - family: Festivo-Letters-No1
      fonts:
        - asset: lib/app/assets/Festivo-Letters-No1-Regular/Festivo-Letters-No1-Regular.ttf

name: aquarium_ecosysteem
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  audioplayers: ^6.1.0
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/app/assets/sound_effects/
    - lib/app/assets/animals/
    - lib/app/assets/animals/cutouts/
    - lib/app/assets/quiz_fotos/
    - lib/app/assets/dier_fotos_hd/
    - lib/app/assets/informatie_videos/
  fonts:
    - family: Festivo-Letters-No1
      fonts:
        - asset: lib/app/assets/Festivo-Letters-No1-Regular/Festivo-Letters-No1-Regular.ttf
